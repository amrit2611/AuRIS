# Keep the Render Free backend warm.
#
# Render Free sleeps a service after 15 min of inactivity. First request
# after sleep takes ~30-40s to cold-start, which hurts the demo UX when
# someone drops by unpredictably. Pinging /health every 14 minutes
# resets that idle timer while still being far under any reasonable
# rate limit.
#
# Cost: this workflow runs ~103 times a day, ~10s per run, ~17 minutes
# of GitHub Actions time per day. Well within the free 2000
# minutes/month on public repos (public repos have unlimited Actions
# minutes anyway).
#
# Doubles as a poor-man's uptime alert: `--fail-with-body` makes curl
# exit non-zero on any HTTP >= 400, which fails the workflow, and GitHub
# emails the repo owner on the FIRST failure of a scheduled workflow.
# Subsequent failures do not spam. A real uptime monitor (UptimeRobot,
# Better Stack) is still recommended when the URL matters to someone
# other than the author.
#
# To disable temporarily: comment out the `schedule:` block.
# To remove entirely (e.g. after upgrading to Render Hobby which never
# sleeps): delete this file.
name: keep-backend-warm

on:
  schedule:
    # Every 5 minutes. Was */14 originally (just under Render's 15-min
    # sleep threshold), but GitHub throttles / skips scheduled workflows
    # on public repos during load spikes, so */14 ran with 2-7 hour gaps
    # in practice and the backend slept through them. */5 gives us
    # multiple firings inside each 15-min sleep window, so even if
    # GitHub skips more than half of them the effective interval stays
    # under the threshold. Cost is a rounding error (still unlimited
    # Actions minutes on public repos).
    - cron: "*/5 * * * *"
  # Allow a manual run from the Actions tab for smoke-testing.
  workflow_dispatch:

# GitHub silently throttles scheduled workflows if a previous run is
# still in flight or if the repo is inactive. Keeping this trivial (one
# curl, no dependencies) makes both of those unlikely.
concurrency:
  group: keep-backend-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping /health
        # --fail-with-body: non-zero exit on 4xx/5xx, and print the body
        #                    so the workflow log shows what went wrong.
        # --max-time 60:    hard cap in case the backend is still
        #                    cold-starting; anything past a minute is
        #                    a real problem, not slow-warm.
        # --retry 2:        one retry with backoff to absorb a single
        #                    transient network blip without a false
        #                    alarm email.
        run: |
          curl \
            --fail-with-body \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            --show-error \
            --silent \
            https://auris-api-ieyb.onrender.com/health
